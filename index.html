<style>
    /* Стиль для насыщенных золотых звёзд */
    .star-particle {
        position: fixed;
        pointer-events: none;
        width: 22px;
        height: 22px;
        /* Насыщенный золотой цвет: от ярко-жёлтого центра к глубокому янтарному краю */
        background: radial-gradient(circle, #ffee55 0%, #ffcc00 45%, #e69500 85%, transparent 100%);
        clip-path: polygon(50% 0%, 61% 35%, 100% 50%, 61% 65%, 50% 100%, 39% 65%, 0% 50%, 39% 35%);
        transform: translate(-50%, -50%);
        mix-blend-mode: screen;
        z-index: 99999999;
        transition: opacity 0.7s ease-out, transform 0.7s ease-out;
    }
</style>

<script>
    (function() {
        if (window._starCursorInitialized) return;
        window._starCursorInitialized = true;

        const particles = [];
        const maxParticles = 30; // Длинный и красивый шлейф
        let currentIndex = 0;

        for (let i = 0; i < maxParticles; i++) {
            const star = document.createElement('div');
            star.classList.add('star-particle');
            star.style.opacity = '0';
            document.body.appendChild(star);
            particles.push(star);
        }

        window.addEventListener('mousemove', (e) => {
            const star = particles[currentIndex];
            
            star.style.transition = 'none';
            star.style.opacity = '1';
            
            star.style.left = `${e.clientX}px`;
            star.style.top = `${e.clientY}px`;
            
            const rotation = Math.random() * 360;
            const scale = Math.random() * 0.4 + 0.9;
            star.style.transform = `translate(-50%, -50%) rotate(${rotation}deg) scale(${scale})`;

            requestAnimationFrame(() => {
                star.style.transition = 'opacity 0.7s ease-out, transform 0.7s ease-out';
                star.style.opacity = '0';
                star.style.transform = `translate(-50%, -50%) rotate(${rotation + 60}deg) scale(0.2)`;
            });

            currentIndex = (currentIndex + 1) % maxParticles;
        });
    })();
</script>
